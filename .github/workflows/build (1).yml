name: Build SpOS2 ISOs
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [N, Programer, Premium]
    steps:
      - uses: actions/checkout@v4

      - name: Ver archivos del repo
        run: |
          find . -not -path './.git/*' -not -path './.git' | sort | head -80
          [ -f build.sh ] || { echo "ERROR: falta build.sh en la RAIZ del repo (al lado de la carpeta app)."; exit 1; }
          [ -d app ] || { echo "ERROR: falta la carpeta app/ en la raiz del repo."; exit 1; }

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools dos2unix

      - name: Construir ISO ${{ matrix.edition }}
        run: |
          dos2unix -q build.sh
          sudo bash build.sh ${{ matrix.edition }}

      - uses: actions/upload-artifact@v4
        with:
          name: SpOS2_${{ matrix.edition }}
          path: SpOS2_${{ matrix.edition }}.iso
          compression-level: 0
          retention-days: 14
